# Test compose — spins up an ephemeral postgres, runs migrations, then the full test suite.
# No named volumes: everything is destroyed on `docker compose down`.
#
# Usage:
#   docker compose -f docker-compose.test.yml up --build --exit-code-from test-runner --renew-anon-volumes --remove-orphans
#
# Exit code mirrors pytest: 0 = all pass, non-zero = failure.

services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: cycloveda_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d cycloveda_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - test-network

  test-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
      secrets:
        - env_test
    # Run migrations then the full test suite in a single container so nothing
    # else exits mid-session (which would trigger --exit-code-from's implicit
    # --abort-on-container-exit and/or reshuffle the Docker network DNS).
    command: sh -c "alembic upgrade head && pytest tests/ --override-ini='addopts=' -v --tb=short -p no:cov"
    env_file:
      - ./backend/.env.test
    environment:
      DATABASE_URL: postgresql+asyncpg://test:test@postgres:5432/cycloveda_test
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - test-network
    restart: "no"

networks:
  test-network:
    driver: bridge

secrets:
  env_test:
    file: ./backend/.env.test
